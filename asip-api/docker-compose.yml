# Host port publishing is optional. Behind HAProxy on t3-net,
# set PUBLISH_PORT= (empty) so the API is reached via asip-api.xaigrok.ir.
name: asip
services:
  postgres:
    image: postgres:16-alpine
    container_name: asip-postgres
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: as_ip
    volumes:
      - asip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d as_ip"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - asip-net

  asip-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-asip-api:latest}
    container_name: asip-api
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${INTERNAL_PORT:-3000}"
    ports:
      - target: ${INTERNAL_PORT:-3000}
        published: ${PUBLISH_PORT-3000}
        protocol: tcp
    environment:
      PORT: ${INTERNAL_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: as_ip
      DB_SSLMODE: disable
      DB_SCHEMA_PATH: /app/db/init.sql
      GIN_MODE: release
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,https://asip.xaigrok.ir}
      SYNC_ENABLED: "true"
      SYNC_ON_STARTUP: "false"
      SYNC_HOUR_UTC: "2"
      SYNC_INTERVAL_DAYS: "5"
      REPO_AS_METADATA_PATH: /data/as-metadata
      REPO_AS_IP_BLOCKS_PATH: /data/as-ip-blocks
      REPO_GEO_IP_BLOCKS_PATH: /data/geo-ip-blocks
      REPO_AS_METADATA_URL: https://github.com/ipverse/as-metadata
      REPO_AS_IP_BLOCKS_URL: https://github.com/ipverse/as-ip-blocks
      REPO_GEO_IP_BLOCKS_URL: https://github.com/ipverse/geo-ip-blocks
      # Outbound internet via mullvad-1 3proxy (openrouter-proxy sidecar on :8778)
      HTTP_PROXY: ${HTTP_PROXY:-http://mullvad-1:8778}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://mullvad-1:8778}
      http_proxy: ${HTTP_PROXY:-http://mullvad-1:8778}
      https_proxy: ${HTTPS_PROXY:-http://mullvad-1:8778}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,postgres,asip-postgres}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,postgres,asip-postgres}
    volumes:
      - asip-data:/data
    networks:
      - asip-net
      - t3-net
      - openvpn-net

networks:
  asip-net:
    name: ${DOCKER_NETWORK:-asip-net}
    external: true
  t3-net:
    name: t3-net
    external: true
  openvpn-net:
    name: openvpn-net
    external: true

volumes:
  asip-data:
  asip-pgdata:
