# Local Docker hot-reload: Postgres + Go Air API + Vite WebUI (bind mounts).
# Usage: docker compose -f docker-compose.local.yml -p asip up -d --force-recreate
name: asip
services:
  postgres:
    image: postgres:16-alpine
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: as_ip
    ports:
      - "5433:5432"
    volumes:
      - asip-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d as_ip"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: golang:1.25-alpine
    restart: "no"
    working_dir: /app
    environment:
      PORT: "3000"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: as_ip
      DB_SSLMODE: disable
      DB_SCHEMA_PATH: /app/db/init.sql
      GIN_MODE: debug
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SYNC_ENABLED: "true"
      SYNC_ON_STARTUP: "false"
      SYNC_HOUR_UTC: "2"
      REPO_AS_METADATA_PATH: /data/as-metadata
      REPO_AS_IP_BLOCKS_PATH: /data/as-ip-blocks
      REPO_GEO_IP_BLOCKS_PATH: /data/geo-ip-blocks
      REPO_AS_METADATA_URL: https://github.com/ipverse/as-metadata
      REPO_AS_IP_BLOCKS_URL: https://github.com/ipverse/as-ip-blocks
      REPO_GEO_IP_BLOCKS_URL: https://github.com/ipverse/geo-ip-blocks
      GOTOOLCHAIN: auto
    command:
      - sh
      - -c
      - apk add --no-cache git gcc musl-dev && go install github.com/air-verse/air@v1.61.7 && air -c .air.toml
    volumes:
      - .:/app
      - asip-gomod:/go/pkg/mod
      - asip-gotmp:/app/tmp
      - asip-data:/data
    ports:
      - "8174:3000"
    depends_on:
      postgres:
        condition: service_healthy

  webui:
    image: node:22-alpine
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_BASE_PATH: "/asip/"
      VITE_HMR_CLIENT_PORT: "80"
      WATCHPACK_POLLING: "true"
      VITE_AS_IP_BASE_URL: ""
    command:
      - sh
      - -c
      - rm -rf /app/node_modules/* /app/node_modules/.[!.]* 2>/dev/null; npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - ../asip-webui:/app
      - asip-webui-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - default
      - pc-armin-local
    depends_on:
      - api

volumes:
  asip-postgres-data:
  asip-gomod:
  asip-gotmp:
  asip-data:
  asip-webui-node-modules:

networks:
  pc-armin-local:
    external: true
